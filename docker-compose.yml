version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexus-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - nexus
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - nexus
    depends_on:
      app:
        condition: service_healthy

  # MySQL Database — ports NOT exposed to host in production (see docker-compose.prod.yml)
  db:
    image: mysql:8.0
    container_name: nexus-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # Bind to loopback only; override in prod to remove entirely
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexus}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_USER: ${DB_USERNAME:-nexus}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - nexus-db:/var/lib/mysql
    networks:
      - nexus
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cache & Queue — ports NOT exposed to host in production
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # Bind to loopback only; override in prod to remove entirely
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    networks:
      - nexus
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Queue Worker — uses Laravel Horizon for full visibility and auto-scaling
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexus-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan horizon
    networks:
      - nexus
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  nexus-db:

networks:
  nexus:
    driver: bridge
